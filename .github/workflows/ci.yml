name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      # Sobe o app de verdade (com PostgreSQL) em vez de só gerar a imagem: as migrações e a
      # gravação de uploads no volume só falham rodando. Sem Ollama no CI: o app segue sem LLM.
      - run: docker compose up -d --build --wait
      - name: Smoke test (criar conta, enviar nota)
        run: |
          set -e
          curl -fsS http://localhost:8000/api/health
          curl -fsS -c cookies.txt -H "Content-Type: application/json" \
            -d '{"username": "ci", "password": "senha-do-ci"}' http://localhost:8000/api/auth/setup
          echo '<nfeProc/>' > nota.xml
          code=$(curl -sS -o resposta.json -w "%{http_code}" -b cookies.txt \
            -F "files=@nota.xml" http://localhost:8000/api/expenses/upload)
          cat resposta.json
          test "$code" = 202
      - if: failure()
        run: docker compose logs app
