[project]
name = "financas-backend"
version = "0.1.0"
description = "API de finanças pessoais com categorização automática por LLM"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Cobertura: `pytest --cov` (o CI roda assim). Conta também os desvios de cada if/else.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Piso, não meta: abaixo disso o CI falha. As partes menos cobertas são as que dependem de
# serviços reais (OCR de foto, HTTP do Ollama/Claude), testadas à mão e na avaliação.
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]
